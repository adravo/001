<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TN Land Verify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #1e3a5f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      color: white;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.4rem; font-weight: 700; }
    p  { font-size: 0.85rem; opacity: 0.6; margin-top: 8px; }
  </style>
</head>
<body>
  <!-- Placeholder shown briefly before Capacitor loads the server URL -->
  <div class="spinner"></div>
  <h1>TN Land Verify</h1>
  <p>Loading…</p>

  <script type="module">
    // Redirect to the production URL if running outside Capacitor shell
    if (!window.Capacitor) {
      window.location.href = 'https://tn-land-verify.vercel.app';
    }
  </script>
</body>
</html>
