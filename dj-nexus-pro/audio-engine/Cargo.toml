[package]
name = "dj-nexus-audio-engine"
version = "0.1.0"
edition = "2021"
authors = ["DJ Nexus Pro Team <dev@djnexuspro.com>"]
description = "High-performance audio engine for DJ Nexus Pro"
license = "MIT"

# NAPI build setup — the build.rs is generated by napi-build
[lib]
crate-type = ["cdylib"]

[dependencies]
# Cross-platform audio I/O
cpal = { version = "0.15", features = ["wasm-bindgen"] }

# DSP primitives
dasp = { version = "0.11", features = ["signal", "interpolate", "interpolate-sinc", "ring_buffer"] }
dasp_signal = { version = "0.11", features = ["all"] }
dasp_frame   = { version = "0.11" }
dasp_sample  = { version = "0.11" }

# Audio decoding
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "aiff", "aac", "isomp4", "mkv"] }

# Time-stretching / pitch-shifting (RubberBand C library via sys bindings)
rubberband-sys = { version = "0.1", optional = true }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Concurrency / channels
crossbeam-channel = "0.5"
crossbeam-utils   = "0.8"
parking_lot       = "0.12"    # faster Mutex/RwLock than std

# FFT (waveform analysis)
rustfft = "6"
apodize = "1"                 # windowing functions

# Numeric
num-complex = "0.4"
num-traits  = "0.2"
bytemuck    = { version = "1", features = ["derive"] }

# Logging
log        = "0.4"
env_logger = "0.11"

# Node.js N-API bindings
napi        = { version = "2", features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = "2"

# Async runtime (for napi async tasks)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
napi-build = "2"

[features]
default = ["pitch-shift"]
pitch-shift = ["rubberband-sys"]

[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
panic            = "abort"
strip            = true

[profile.dev]
opt-level = 1      # some optimization even in debug for real-time audio

[package.metadata.docs.rs]
all-features = true
