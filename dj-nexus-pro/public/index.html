<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <!--
      Content Security Policy:
      • script-src 'self'        — only scripts from our own origin (Vite dev: also 'unsafe-eval' via HMR transform)
      • style-src 'self' 'unsafe-inline' — inline <style> tags used by component CSS-in-JS
      • img-src 'self' data: blob: — decoded waveform data URIs and blob URLs
      • media-src 'self' blob:   — audio blobs from the renderer
      • connect-src 'self' ws:   — Vite HMR websocket in dev; IPC bridge in prod
      • worker-src 'self' blob:  — Web Workers for waveform rendering
      • object-src 'none'        — block <object>/<embed>
      • base-uri 'self'          — prevent base-tag injection
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        media-src 'self' blob:;
        connect-src 'self' ws: wss:;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
      "
    />

    <title>DJ Nexus Pro</title>

    <!--
      Prevent FOUC: apply dark background immediately before JS loads.
      The accent color default matches the CSS custom property in App.tsx.
    -->
    <style>
      :root {
        --bg-1: #0d0d1a;
        --accent: #00d1ff;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-1);
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      /* Loading spinner shown before React mounts */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-1);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        gap: 16px;
        z-index: 9999;
        transition: opacity 0.3s;
      }

      #app-loader.hidden { opacity: 0; pointer-events: none; }

      .loader-logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--accent);
      }

      .loader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(0, 209, 255, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <!-- Loading indicator (hidden once React mounts) -->
    <div id="app-loader">
      <div class="loader-logo">DJ NEXUS PRO</div>
      <div class="loader-spinner"></div>
      <span>Loading audio engine…</span>
    </div>

    <!-- React mount point -->
    <div id="root"></div>

    <!-- Hide loader when React fires DOMContentLoaded -->
    <script>
      // Conceal the loader as soon as React has rendered something
      document.addEventListener('DOMContentLoaded', function () {
        // React renders synchronously on the first pass; give it one rAF
        requestAnimationFrame(function () {
          var loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function () { loader.remove(); }, 400);
          }
        });
      });
    </script>

    <!-- Renderer entry point (injected by Vite) -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
