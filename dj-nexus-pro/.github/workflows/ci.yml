# ─────────────────────────────────────────────────────────────────────────────
# DJ Nexus Pro — GitHub Actions CI / CD
# ─────────────────────────────────────────────────────────────────────────────
#
# Jobs:
#   lint-typecheck  — ESLint + TypeScript (all platforms → single runner)
#   test            — Vitest unit tests
#   build-rust      — Cargo build of audio engine (linux / macos / windows)
#   build-electron  — electron-builder installer packages
#   release         — uploads artifacts to GitHub release on tag push
# ─────────────────────────────────────────────────────────────────────────────

name: CI / CD

on:
  push:
    branches: [main, develop, 'release/**']
    tags:     ['v*.*.*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  RUST_TOOLCHAIN: stable

# ── Shared defaults ────────────────────────────────────────────────────────────

defaults:
  run:
    shell: bash

# ═══════════════════════════════════════════════════════════════════════════════
# Job: lint-typecheck
# ═══════════════════════════════════════════════════════════════════════════════

jobs:
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — renderer
        run: npm run typecheck

      - name: TypeScript — electron
        run: npm run typecheck:electron

      - name: ESLint
        run: npm run lint

# ═══════════════════════════════════════════════════════════════════════════════
# Job: test
# ═══════════════════════════════════════════════════════════════════════════════

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

# ═══════════════════════════════════════════════════════════════════════════════
# Job: build-rust
# ═══════════════════════════════════════════════════════════════════════════════

  build-rust:
    name: Rust Audio Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dj-nexus-audio-engine.linux-x64.node
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: dj-nexus-audio-engine.darwin-x64.node
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dj-nexus-audio-engine.darwin-arm64.node
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dj-nexus-audio-engine.win32-x64.node

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: audio-engine

      # Linux: install ALSA dev headers (required by cpal)
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build Rust audio engine
        working-directory: audio-engine
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run Rust tests
        working-directory: audio-engine
        # Can't run cross-compiled tests; only test native target
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.os == 'macos-latest' && matrix.target == 'x86_64-apple-darwin' || matrix.os == 'windows-latest'
        run: cargo test --release --target ${{ matrix.target }}

      # Locate the .node binary and upload it
      - name: Collect .node binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-native
          find audio-engine/target/${{ matrix.target }}/release -maxdepth 1 -name "*.node" \
            -exec cp {} dist-native/${{ matrix.artifact }} \; || true
          ls -lh dist-native/ || echo "No .node binary found (napi build may be needed separately)"

      - name: Collect .node binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist-native
          $files = Get-ChildItem "audio-engine/target/${{ matrix.target }}/release" -Filter "*.node" -ErrorAction SilentlyContinue
          foreach ($f in $files) { Copy-Item $f.FullName "dist-native/${{ matrix.artifact }}" }
        shell: pwsh

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.artifact }}
          path: dist-native/
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# Job: build-electron
# ═══════════════════════════════════════════════════════════════════════════════

  build-electron:
    name: Electron Installer (${{ matrix.os }})
    needs: [lint-typecheck, test, build-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_flag: --linux
            artifact_glob: 'release/*.AppImage release/*.deb'
          - os: macos-latest
            build_flag: --mac
            artifact_glob: 'release/*.dmg'
          - os: windows-latest
            build_flag: --win
            artifact_glob: 'release/*.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Pull all native binaries built in the previous job
      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: src/native/
          merge-multiple: true

      # Linux: install system libs needed by Electron
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev libasound2-dev \
            libxss1 libgconf-2-4 libnss3 libx11-xcb1 libxcb-dri3-0

      - name: Install Node dependencies
        run: npm ci

      - name: Build Electron main process
        run: npm run build:electron

      - name: Build React renderer
        run: npm run build:renderer

      - name: Package (electron-builder)
        env:
          # macOS code signing (optional — skip if secrets not set)
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
          # Windows code signing (optional)
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD || '' }}
          # Skip signing if secrets absent
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist ${{ matrix.build_flag }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/
          if-no-files-found: warn
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# Job: release  (only on version tags)
# ═══════════════════════════════════════════════════════════════════════════════

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DJ Nexus Pro ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
