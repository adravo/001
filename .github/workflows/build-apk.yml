name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      release_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build-apk:
    name: Build ${{ github.event.inputs.release_type || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # ── Java (required for Gradle / Android build) ───────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK ──────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            --sdk_root=$ANDROID_SDK_ROOT

      # ── Capacitor install & Android platform ─────────────────────────────
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      # ── Patch app name & version ─────────────────────────────────────────
      - name: Set app version from git tag (if present)
        working-directory: mobile/android
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION  VERSION_CODE=$VERSION_CODE"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" app/build.gradle

      # ── Build debug APK ──────────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ github.event.inputs.release_type != 'release' }}
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # ── Build release APK (signed) ───────────────────────────────────────
      - name: Decode keystore
        if: ${{ github.event.inputs.release_type == 'release' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/release.keystore

      - name: Build release APK
        if: ${{ github.event.inputs.release_type == 'release' }}
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: app/release.keystore
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon

      # ── Rename & upload APK artifact ─────────────────────────────────────
      - name: Rename APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.release_type || 'debug' }}"
          SRC="mobile/android/app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}.apk"
          DEST="TN-Land-Verify-${BUILD_TYPE}-$(date +%Y%m%d-%H%M).apk"
          mv "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TN-Land-Verify-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # ── Auto-create GitHub Release on tag push ───────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
